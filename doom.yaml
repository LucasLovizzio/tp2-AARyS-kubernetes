apiVersion: apps/v1
kind: Deployment
metadata:
  name: doom-deployment
  labels:
    app: doom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doom
  template:
    metadata:
      labels:
        app: doom
    spec:
      containers:
      - name: doom
        image: b0nam/docker-doom:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: doom-service
  labels:
    app: doom
spec:
  type: ClusterIP
  selector:
    app: doom
  ports:
  - port: 80
    targetPort: 8080
